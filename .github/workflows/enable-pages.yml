name: Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages status
        run: |
          echo "=== GET pages ==="
          gh api /repos/${{ github.repository }}/pages || echo "Pages not enabled (404)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Pages site (workflow build type)
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages -f build_type=workflow || echo "create failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Pages status
        run: |
          gh api /repos/${{ github.repository }}/pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
